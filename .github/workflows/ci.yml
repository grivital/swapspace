name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build (${{ matrix.cc }}, ${{ matrix.configure || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        configure: ["", "--enable-noconfig", "--enable-nodebug"]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake
      - name: Generate configure
        run: autoreconf -i
      - name: Configure, build and test
        run: |
          mkdir build
          cd build
          CC=${{ matrix.cc }} ../configure ${{ matrix.configure }} \
            CFLAGS="-O2 -g -Wall -Wextra -Wformat=2"
          make
          make check

  sanitizers:
    name: sanitizers (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake clang
      - name: Generate configure
        run: autoreconf -i
      - name: Build and test with ASan/UBSan
        run: |
          mkdir build
          cd build
          CC=clang ../configure \
            CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined"
          make
          make check

  fuzz:
    name: fuzz (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake clang
      - name: Generate configure
        run: autoreconf -i
      - name: Build with fuzzing enabled
        run: |
          mkdir build
          cd build
          CC=clang ../configure --enable-fuzzing
          make
          make check
      - name: Fuzz the /proc/meminfo parser
        working-directory: build
        run: |
          mkdir -p corpus
          printf 'MemTotal: 16384 kB\nMemFree: 8192 kB\n' > corpus/seed
          ./tests/fuzz_meminfo -max_total_time=30 -timeout=5 corpus

  distcheck:
    name: distcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake
      - name: Generate configure
        run: autoreconf -i
      - run: ./configure && make distcheck

  packages:
    name: packages (${{ matrix.id }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: arch, target: arch, image: "archlinux:base-devel"}
          - {id: debian-stable, target: deb, image: "debian:stable"}
          - {id: ubuntu-24.04, target: deb, image: "ubuntu:24.04"}
          - {id: fedora, target: rpm, image: "fedora:latest"}
    steps:
      # The minimal images lack git, and checkout needs it for fetch-depth: 0.
      - name: Install git
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            arch) pacman -Syu --noconfirm --needed git ;;
            deb) apt-get update && apt-get install -y git ca-certificates ;;
            rpm) dnf install -y git-core ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The workspace is owned by another uid than the container user.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the package
        run: packaging/build.sh ${{ matrix.target }} packages --install-deps
      - name: Smoke test the package
        run: packaging/smoke.sh ${{ matrix.target }} packages/*
      - uses: actions/upload-artifact@v4
        with:
          name: swapspace-${{ matrix.id }}
          path: packages/*
          if-no-files-found: error
