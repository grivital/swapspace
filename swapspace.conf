# Swap path: location where swapspace may create and delete swapfiles.  For
# security reasons this directory must be accessible to root and to root only.
#swappath="/usr/local/var/lib/swapspace"

# Lower free-space threshold: if the percentage of free space drops below this
# number, additional swapspace is allocated
#lower_freelimit=20

# Upper free-space threshold: if the percentage of free space exceeds this
# number, swapspace will attempt to free up swapspace
#upper_freelimit=60

# Percentage of free space swapspace should aim for when adding swapspace.  This
# should fall somewhere between lower_freelimit and upper_freelimit.
#freetarget=30

# Memory-pressure threshold: PSI's "some avg10" value, as a percentage of time.
# When memory pressure exceeds this, swapspace allocates swap even before
# lower_freelimit is reached, and does not deallocate while under pressure.
# Set to 0 to ignore PSI.  Requires Linux 4.20 or later and a mounted
# /proc/pressure; silently ignored otherwise.
#psi_threshold=10

# Smallest allowed size for individual swapfiles
#min_swapsize=4m

# Greatest allowed size for individual swapfiles
#max_swapsize=2t

# Duration (roughly in seconds) of the moratorium on swap allocation that is
# instated if disk space runs out, or the cooldown time after a new swapfile is
# successfully allocated before swapspace will consider deallocating swap space
# again.  The default cooldown period is about 10 minutes.
#cooldown=600

# Encrypt swapfiles: attach each to a loop device and map it through dm-crypt
# (plain mode) with a random key held only by the kernel, then swap on the
# mapped device.  If any step fails, no swap is created; a file is never used
# unencrypted.  This protects swapped data stored on disk; it does not protect
# RAM, zram or zswap.  Needs cryptsetup 2 or later, the loop module (Linux 5.8
# or later), dm-crypt, and a swap directory on a filesystem and device where
# direct I/O works.  This mode trades robustness under extreme memory pressure
# for encryption: the loop driver's workqueue has no memory-reclaim rescuer, so
# swapping through it can deadlock when memory is exhausted, and it is
# freezable, so swap-out stalls during suspend.  zram, or swap on an encrypted
# partition, is safer.  On btrfs the swap files must have NOCOW (and a single
# data profile); otherwise creating them is refused.  See the ENCRYPTED SWAPFILES section of swapspace(8).
# Off by default.
#crypt

# Cipher used with crypt: letters, digits and ":_.-" only.  Null ciphers and
# the ecb mode are refused.
#crypt_cipher=aes-xts-plain64

# Key size in bits used with crypt (128 to 1024, a multiple of 8).  XTS ciphers
# need 256 or 512; AES in other modes needs 128, 192 or 256; for other ciphers
# the kernel decides when the first mapping is created.
#crypt_keysize=512
