# Swap path: location where swapspace may create and delete swapfiles.  For
# security reasons this directory must be accessible to root and to root only.
#swappath="/usr/local/var/lib/swapspace"

# Lower free-space threshold: if the percentage of free space drops below this
# number, additional swapspace is allocated
#lower_freelimit=20

# Upper free-space threshold: if the percentage of free space exceeds this
# number, swapspace will attempt to free up swapspace
#upper_freelimit=60

# Percentage of free space swapspace should aim for when adding swapspace.  This
# should fall somewhere between lower_freelimit and upper_freelimit.
#freetarget=30

# Memory-pressure threshold: PSI's "some avg10" value, as a percentage of time.
# When memory pressure exceeds this, swapspace allocates swap even before
# lower_freelimit is reached, and does not deallocate while under pressure.
# Set to 0 to ignore PSI.  Requires Linux 4.20 or later and a mounted
# /proc/pressure; silently ignored otherwise.
#psi_threshold=10

# Smallest allowed size for individual swapfiles
#min_swapsize=4m

# Greatest allowed size for individual swapfiles
#max_swapsize=2t

# Compaction: the kernel allows only a limited number of swap areas in total
# (at most 32, and often 24-28 depending on kernel config and other swap areas
# such as zram and swap partitions).  Every swapfile uses one.  Once at least
# compact_threshold swapspace swapfiles are in use,
# every new swapfile may be compact_factor times larger than the previous one:
# both min_swapsize and max_swapsize are multiplied by compact_factor^n, where
# n is the number of swapfiles in use minus compact_threshold plus one, up to
# compact_max_swapsize.  With max_swapsize=1g, the defaults allow 2g, 4g, 8g
# and then 16g per file, so make sure the disk has room; if a compacted file
# does not fit in the free disk space, the configured size is used instead.
# New files are back to normal size once enough swapfiles have been retired;
# existing files are never resized.  This does not create more slots and does
# not help once all of them are in use.  The threshold counts only swapspace's own files, so lower it if
# zram or other swap areas take slots.  A threshold of 0 disables compaction,
# a factor of 1 gives it no effect, and a cap of 0 means no limit.
#compact_threshold=16
#compact_factor=2
#compact_max_swapsize=16g

# Duration (roughly in seconds) of the moratorium on swap allocation that is
# instated if disk space runs out, or the cooldown time after a new swapfile is
# successfully allocated before swapspace will consider deallocating swap space
# again.  The default cooldown period is about 10 minutes.
#cooldown=600

